services:
  caddy:
    image: caddy:2.10-alpine
    depends_on:
      - auralphaapp
      - auralpha-api
      - discovery-engine
    ports:
      - "${PLATFORM_HTTP_PORT:-80}:80"
      - "${PLATFORM_HTTPS_PORT:-443}:443"
    volumes:
      - ${CADDYFILE_PATH:-./deploy/Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    networks:
      - edge

  auralphaapp:
    build:
      context: ../../Frontend/aurAlphaApp
      dockerfile: Dockerfile
      args:
        API_BASE_URL: ${FRONTEND_API_BASE_URL:-https://api.example.com/api/v1}
        API_KEY: ${FRONTEND_API_KEY:-}
        DISCOVERY_API_BASE_URL: ${FRONTEND_DISCOVERY_API_BASE_URL:-https://discovery.example.com/api/v1/discovery}
        DISCOVERY_WS_URL: ${FRONTEND_DISCOVERY_WS_URL:-wss://discovery.example.com/ws/discovery}
        APP_API_TIMEOUT_MS: ${FRONTEND_APP_API_TIMEOUT_MS:-10000}
    image: auralphaapp:prod
    restart: unless-stopped
    networks:
      - edge

  auralpha-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: auralpha-backend:prod
    env_file:
      - ${BACKEND_ENV_FILE:-./environments/production/.env}
    environment:
      APP_ENV: production
      NODE_ENV: production
      PORT: 3000
      DB_SYNCHRONIZE: "false"
      REDIS_AUTO_START: "false"
      ACTIVITY_EXPORT_STORAGE_DIR: /app/storage/activity-exports
      DISCOVERY_API_BASE_URL: http://discovery-engine:8000/api/v1/discovery
      SCHEDULER_WORKER_SCHEMA: http
      SCHEDULER_WORKER_HOST: auralpha-scheduler-worker
      SCHEDULER_WORKER_PORT: 3001
      SCHEDULER_WORKER_BASE_URL: http://auralpha-scheduler-worker:3001
    volumes:
      - activity-exports:/app/storage/activity-exports
    restart: unless-stopped
    depends_on:
      - auralpha-scheduler-worker
      - discovery-engine
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const port=process.env.PORT||'3000'; const prefix=process.env.APP_ROUTE_PREFIX||'/api/v1'; fetch('http://127.0.0.1:'+port+prefix+'/health').then((res)=>process.exit(res.ok?0:1)).catch(()=>process.exit(1));"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - edge
      - core

  auralpha-email-worker:
    profiles: ["email"]
    build:
      context: .
      dockerfile: Dockerfile
    image: auralpha-backend:prod
    env_file:
      - ${BACKEND_ENV_FILE:-./environments/production/.env}
    environment:
      APP_ENV: production
      NODE_ENV: production
      DB_SYNCHRONIZE: "false"
      REDIS_AUTO_START: "false"
      ACTIVITY_EXPORT_STORAGE_DIR: /app/storage/activity-exports
      DISCOVERY_API_BASE_URL: http://discovery-engine:8000/api/v1/discovery
      SCHEDULER_WORKER_SCHEMA: http
      SCHEDULER_WORKER_HOST: auralpha-scheduler-worker
      SCHEDULER_WORKER_PORT: 3001
      SCHEDULER_WORKER_BASE_URL: http://auralpha-scheduler-worker:3001
    command: ["node", "dist/app.email-worker.js"]
    volumes:
      - activity-exports:/app/storage/activity-exports
    restart: unless-stopped
    depends_on:
      - auralpha-api
    networks:
      - core

  auralpha-scheduler-worker:
    build:
      context: ../aurAlphaSchedulerWorker
      dockerfile: Dockerfile
    image: auralpha-scheduler-worker:prod
    env_file:
      - ${WORKER_ENV_FILE:-../aurAlphaSchedulerWorker/environments/production/.env}
    environment:
      NODE_ENV: production
      REDIS_AUTO_START: "false"
      WORKER_HTTP_HOST: 0.0.0.0
      WORKER_HTTP_PORT: 3001
      TRADING_API_BASE_URL: http://auralpha-api:3000/api/v1
      TRADING_API_HEALTH_URL: http://auralpha-api:3000/api/v1/health
      DISCOVERY_ENGINE_BASE_URL: http://discovery-engine:8000/api/v1/discovery
      DISCOVERY_ENGINE_HEALTH_URL: http://discovery-engine:8000/health/ready
    restart: unless-stopped
    expose:
      - "3001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then((res)=>process.exit(res.ok?0:1)).catch(()=>process.exit(1));"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - core

  discovery-engine:
    build:
      context: ../discovery-engine
      dockerfile: Dockerfile
    image: discovery-engine:prod
    env_file:
      - ${DISCOVERY_ENV_FILE:-../discovery-engine/environments/production/.env}
    environment:
      NODE_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      REDIS_AUTO_START: "false"
      SCHEDULER_WORKER_SCHEMA: http
      SCHEDULER_WORKER_HOST: auralpha-scheduler-worker
      SCHEDULER_WORKER_PORT: 3001
      SCHEDULER_WORKER_BASE_URL: http://auralpha-scheduler-worker:3001
      NODE_BACKEND_URL: http://auralpha-api:3000/api/v1
      NODE_BACKEND_API_KEY: ${DISCOVERY_NODE_BACKEND_API_KEY:-}
    restart: unless-stopped
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready').status == 200 else 1)"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - edge
      - core

volumes:
  activity-exports:
  caddy-data:
  caddy-config:

networks:
  edge:
  core:
